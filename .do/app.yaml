# DigitalOcean App Platform — HoldPose API
# Deployed via scripts/deploy-digitalocean.sh (builds + pushes DOCR image).
#
# Docs: https://docs.digitalocean.com/products/app-platform/
name: holdpose-api
region: nyc

services:
  - name: api
    http_port: 8080
    instance_count: 1
    # ~$10/mo fixed 1vCPU / 1GB (Cloud Run-comparable)
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    dockerfile_path: Dockerfile
    github:
      repo: rashidjatoi/snap-app-backend
      branch: feature/poseping-friends
      deploy_on_push: true
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      # Secrets — set by deploy script from backend/.env (type: SECRET)
      - key: MONGO_URI
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FIREBASE_STORAGE_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_SHARE_BASE_URL
        scope: RUN_TIME
        type: GENERAL
      - key: FIREBASE_SERVICE_ACCOUNT
        scope: RUN_TIME
        type: SECRET
