# HoldPose WebRTC TURN (coturn) — run on a public DigitalOcean Droplet
# (App Platform cannot expose UDP/TCP 3478 for media relay).
#
# On a Droplet with Docker:
#   EXTERNAL_IP=$(curl -s https://api.ipify.org) \
#     docker compose -f docker-compose.turn.yml up -d
#
# Then set Flutter / backend TURN_* to that Droplet IP
# (user/pass defaults: snap / snapturn).

services:
  coturn:
    image: instrumentisto/coturn:latest
    container_name: holdpose-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP:?Set EXTERNAL_IP to the Droplet public IP}
      TURN_USER: ${TURN_USER:-snap}
      TURN_PASS: ${TURN_PASS:-snapturn}
      TURN_REALM: ${TURN_REALM:-holdpose}
    command:
      - -n
      - --log-file=stdout
      - --external-ip=${EXTERNAL_IP}
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49300
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER:-snap}:${TURN_PASS:-snapturn}
      - --realm=${TURN_REALM:-holdpose}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --verbose
      # Default coturn denies private peers → CreatePermission 403 → peer usage 0.
      - --allowed-peer-ip=0.0.0.0-255.255.255.255
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
